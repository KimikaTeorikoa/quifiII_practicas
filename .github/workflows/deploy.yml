name: my-pages-build-deploy

on:
  # Trigger the deploy on push to main branch
  # (feature branches are built to check them, but only master is deployed)
  push:
    branches:
      - master
      - 'feature/**'
  schedule:
    - cron: '0 0 1 * *'

jobs: 
 
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: setup python
      uses: s-weigand/setup-conda@v1
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # One book per language folder (es/, eu/, en/), each published at /<lang>/
    - name: Build books
      run: |
        mkdir -p site
        for lang in es eu en; do
          if [ -f "$lang/_config.yml" ]; then
            jupyter-book build "$lang" || exit 1
            cp -r "$lang/_build/html" "site/$lang"
          fi
        done
        cp landing/index.html site/index.html
        # Pre-languages URLs (/intro.html, /content/...) redirect to es/
        (cd site/es && find . -name '*.html' -not -path './_*') |
        while read -r f; do
          f=${f#./}; up=$(echo "$f" | sed -E 's|[^/]+/|../|g; s|[^/]*$||')
          [ -e "site/$f" ] && continue
          mkdir -p "site/$(dirname "$f")"
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%ses/%s"><link rel="canonical" href="%ses/%s">\n' \
            "$up" "$f" "$up" "$f" > "site/$f"
        done

    - name: Push html to github-pages
      if: github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3.9.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        force_orphan: true
