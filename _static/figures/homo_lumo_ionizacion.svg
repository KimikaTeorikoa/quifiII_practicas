<svg viewBox="0 0 280 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11">
  <title>Diagrama HOMO/LUMO y energía de ionización</title>
  <desc>Diagrama de niveles de energía orbital: niveles ocupados genéricos, HOMO (nivel ocupado de mayor energía), LUMO (primer nivel desocupado) y flecha de ionización hasta el nivel de vacío.</desc>

  <defs>
    <marker id="arrE" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrIE" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <line x1="44" y1="370" x2="44" y2="22" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrE)"/>
  <text x="40" y="18" font-size="13" font-style="italic" fill="#1a1a1a" text-anchor="middle">E</text>

  <line x1="50" y1="52" x2="230" y2="52" stroke="#6c757d" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="236" y="56" font-size="9.5" fill="#6c757d">E = 0</text>

  <line x1="66" y1="118" x2="190" y2="118" stroke="#d35400" stroke-width="2" stroke-dasharray="7 3"/>
  <text x="196" y="122" font-size="11" font-weight="bold" fill="#d35400">LUMO</text>

  <line x1="66" y1="188" x2="190" y2="188" stroke="#2471a3" stroke-width="3"/>
  <text x="196" y="192" font-size="11" font-weight="bold" fill="#2471a3">HOMO</text>
  <text x="66" y="182" font-size="9" font-style="italic" fill="#2471a3">ε_HOMO</text>
  <text x="123" y="183" font-size="13" fill="#2471a3" text-anchor="middle">↑</text>

  <line x1="66" y1="248" x2="190" y2="248" stroke="#adb5bd" stroke-width="1.6"/>
  <line x1="66" y1="298" x2="190" y2="298" stroke="#adb5bd" stroke-width="1.6"/>
  <line x1="66" y1="345" x2="190" y2="345" stroke="#adb5bd" stroke-width="1.6"/>
  <text x="196" y="300" font-size="9.5" fill="#adb5bd">niveles</text>
  <text x="196" y="312" font-size="9.5" fill="#adb5bd">ocupados</text>

  <line x1="128" y1="185" x2="128" y2="56" stroke="#c0392b" stroke-width="2" marker-end="url(#arrIE)"/>
  <text x="136" y="128" font-size="10" font-weight="bold" fill="#c0392b">IE</text>
  <text x="136" y="141" font-size="9" fill="#c0392b">≈ −ε_HOMO</text>
</svg>
