<svg viewBox="0 0 500 295" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Helvetica Neue', Arial, sans-serif" font-size="10">
  <title>Pasos de optimización de geometría convergiendo al mínimo</title>
  <desc>Curva de energía potencial parabólica (E vs coordenada nuclear Q) con cuatro pasos numerados del algoritmo de optimización de Gaussian convergiendo hacia la geometría de equilibrio.</desc>

  <defs>
    <marker id="axA" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Parábola: y = 255 − 0.0055·(x−270)²  [mínimo en x=270, y=255] -->
  <polyline fill="none" stroke="#1a1a2e" stroke-width="2.2" stroke-linejoin="round"
    points="70,35 90,77 110,114 130,147 150,176 170,200 190,220 210,235 230,246 250,253 270,255 290,253 310,246 330,235 350,220 370,200 390,176 410,147 430,114 450,77 470,35"/>

  <!-- Ejes -->
  <line x1="55" y1="272" x2="55" y2="20"  stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#axA)"/>
  <line x1="55" y1="272" x2="484" y2="272" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#axA)"/>
  <text x="272" y="290" text-anchor="middle" font-size="11" fill="#1a1a1a">Coordenada nuclear Q</text>
  <text transform="rotate(-90,16,148)" x="16" y="148" text-anchor="middle" font-size="11" fill="#1a1a1a">E</text>

  <!-- Trayectoria de optimización -->
  <polyline fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"
    points="100,96 152,186 222,241 263,255"/>

  <!-- Puntos numerados -->
  <circle cx="100" cy="96"  r="5.5" fill="#c0392b" stroke="white" stroke-width="1"/>
  <text x="108" y="93"  font-size="9.5" fill="#c0392b" font-weight="bold">1</text>

  <circle cx="152" cy="186" r="5.5" fill="#c0392b" stroke="white" stroke-width="1"/>
  <text x="160" y="183" font-size="9.5" fill="#c0392b" font-weight="bold">2</text>

  <circle cx="222" cy="241" r="5.5" fill="#c0392b" stroke="white" stroke-width="1"/>
  <text x="230" y="238" font-size="9.5" fill="#c0392b" font-weight="bold">3</text>

  <circle cx="263" cy="255" r="5.5" fill="#2471a3" stroke="white" stroke-width="1"/>
  <text x="258" y="248" font-size="9.5" fill="#2471a3" font-weight="bold">4</text>

  <!-- Mínimo -->
  <circle cx="270" cy="255" r="4" fill="none" stroke="#2471a3" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="274" y1="252" x2="318" y2="228" stroke="#2471a3" stroke-width="0.9"/>
  <text x="320" y="226" font-size="9.5" fill="#2471a3">geometría de equilibrio</text>
  <text x="320" y="238" font-size="9"   fill="#2471a3">(Q&#x2091;&#x2097;)</text>

  <text x="80" y="265" font-size="8.5" fill="#6c757d" font-style="italic">geometría inicial</text>
</svg>
