<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>Helioaren 1s orbitalaren dentsitate elektronikoa</title>
  <desc>Helio-atomoaren 1s orbitalaren dentsitate elektronikoaren gainazalak erakusten dituen diagrama zientifikoa, erdian nukleoa eta r distantzia adierazten duen gezi erradialarekin.</desc>

  <!-- Isosuperficies de densidad electrónica -->
  <circle cx="200" cy="195" r="22"  fill="none" stroke="#4a6fa5" stroke-width="2.2" opacity="0.90"/>
  <circle cx="200" cy="195" r="44"  fill="none" stroke="#4a6fa5" stroke-width="2.0" opacity="0.75"/>
  <circle cx="200" cy="195" r="68"  fill="none" stroke="#4a6fa5" stroke-width="1.8" opacity="0.58"/>
  <circle cx="200" cy="195" r="94"  fill="none" stroke="#4a6fa5" stroke-width="1.6" opacity="0.40"/>
  <circle cx="200" cy="195" r="122" fill="none" stroke="#4a6fa5" stroke-width="1.4" opacity="0.25"/>
  <circle cx="200" cy="195" r="152" fill="none" stroke="#4a6fa5" stroke-width="1.2" opacity="0.14"/>
  <circle cx="200" cy="195" r="182" fill="none" stroke="#4a6fa5" stroke-width="1.0" opacity="0.07"/>

  <!-- Nukleoa -->
  <circle cx="200" cy="195" r="6" fill="#2c3e6b"/>
  <text x="212" y="191" font-size="12" fill="#2c3e6b" font-weight="bold">He</text>

  <!-- Gezi erradiala r -->
  <line x1="204" y1="199" x2="326" y2="321" stroke="#4a4a4a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <polygon points="326,321 314,315 320,309" fill="#4a4a4a"/>
  <text x="284" y="284" font-size="12" fill="#4a4a4a" font-style="italic">r</text>

  <!-- Titulua -->
  <text x="200" y="390" font-size="11" fill="#4a4a4a" text-anchor="middle">1s orbitalaren dentsitate elektronikoa</text>
</svg>
