<svg viewBox="0 0 550 215" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Helvetica Neue', Arial, sans-serif" font-size="10">
  <title>Proyecciones de Newman de un 1,2-dihaloetano</title>
  <desc>Tres proyecciones de Newman del 1,2-dihaloetano mostrando las conformaciones anti (180°), gauche (60°) y eclipsada (0°). X = halógeno (Cl). Círculo = carbono trasero; punto = carbono delantero.</desc>

  <!-- ANTI (180°) cx=82, cy=100 -->
  <circle cx="82" cy="100" r="42" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
  <circle cx="82" cy="100" r="4"  fill="#4a4a4a"/>
  <line x1="82" y1="100" x2="82"    y2="142"  stroke="#1a1a1a" stroke-width="2"/>
  <line x1="82" y1="100" x2="45.6"  y2="79"   stroke="#1a1a1a" stroke-width="2"/>
  <line x1="82" y1="100" x2="118.4" y2="79"   stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="82"   cy="160" r="7" fill="#4a7a2a" stroke="#2d5a10" stroke-width="1"/>
  <text   x="82"   y="163"  text-anchor="middle" font-size="8" fill="white" font-weight="bold">X</text>
  <text   x="23"   y="69"   text-anchor="middle" font-size="10" fill="#4a4a4a">H</text>
  <text   x="141"  y="69"   text-anchor="middle" font-size="10" fill="#4a4a4a">H</text>
  <line x1="82"    y1="58"  x2="82"    y2="40"    stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="118.4" y1="121" x2="131.6" y2="128.5" stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="45.6"  y1="121" x2="32.4"  y2="128.5" stroke="#1a1a1a" stroke-width="1.3"/>
  <circle cx="82"  cy="27"  r="7" fill="#4a7a2a" stroke="#2d5a10" stroke-width="1"/>
  <text   x="82"  y="30"   text-anchor="middle" font-size="8" fill="white" font-weight="bold">X</text>
  <text   x="141" y="133"  text-anchor="start"  font-size="10" fill="#6c757d">H</text>
  <text   x="23"  y="133"  text-anchor="end"    font-size="10" fill="#6c757d">H</text>
  <text x="82"  y="188" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold">Anti</text>
  <text x="82"  y="202" text-anchor="middle" font-size="10" fill="#4a4a4a">(180°)</text>

  <!-- GAUCHE (60°) cx=270, cy=100 -->
  <circle cx="270" cy="100" r="42" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
  <circle cx="270" cy="100" r="4"  fill="#4a4a4a"/>
  <line x1="270" y1="100" x2="270"   y2="142"  stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="100" x2="233.6" y2="79"   stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="100" x2="306.4" y2="79"   stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="270"  cy="160" r="7" fill="#4a7a2a" stroke="#2d5a10" stroke-width="1"/>
  <text   x="270"  y="163"  text-anchor="middle" font-size="8" fill="white" font-weight="bold">X</text>
  <text   x="211"  y="69"   text-anchor="middle" font-size="10" fill="#4a4a4a">H</text>
  <text   x="329"  y="69"   text-anchor="middle" font-size="10" fill="#4a4a4a">H</text>
  <line x1="233.6" y1="121" x2="219.8" y2="129"  stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="270"   y1="58"  x2="270"   y2="40"    stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="306.4" y1="121" x2="320.3" y2="129"   stroke="#1a1a1a" stroke-width="1.3"/>
  <circle cx="213" cy="133" r="7" fill="#4a7a2a" stroke="#2d5a10" stroke-width="1"/>
  <text   x="213" y="136"  text-anchor="middle" font-size="8" fill="white" font-weight="bold">X</text>
  <text x="270" y="28"  text-anchor="middle" font-size="10" fill="#6c757d">H</text>
  <text x="329" y="134" text-anchor="start"  font-size="10" fill="#6c757d">H</text>
  <path d="M 270,118 A 18,18 0 0,1 254.4,109"
        fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="256" y="122" font-size="8" fill="#c0392b">60°</text>
  <text x="270" y="188" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold">Gauche</text>
  <text x="270" y="202" text-anchor="middle" font-size="10" fill="#4a4a4a">(60°)</text>

  <!-- ECLIPSADO (~0°) cx=458, cy=100 — back bonds offset 10° para visibilidad -->
  <circle cx="458" cy="100" r="42" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
  <circle cx="458" cy="100" r="4"  fill="#4a4a4a"/>
  <line x1="458" y1="100" x2="458"   y2="142"  stroke="#1a1a1a" stroke-width="2"/>
  <line x1="458" y1="100" x2="421.6" y2="79"   stroke="#1a1a1a" stroke-width="2"/>
  <line x1="458" y1="100" x2="494.4" y2="79"   stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="458"  cy="160" r="7" fill="#4a7a2a" stroke="#2d5a10" stroke-width="1"/>
  <text   x="458"  y="163"  text-anchor="middle" font-size="8" fill="white" font-weight="bold">X</text>
  <text   x="399"  y="69"   text-anchor="middle" font-size="10" fill="#4a4a4a">H</text>
  <text   x="517"  y="69"   text-anchor="middle" font-size="10" fill="#4a4a4a">H</text>
  <line x1="450.7" y1="141.4" x2="447.9" y2="157.1" stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="425.8" y1="73.0"  x2="413.6" y2="62.7"  stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="497.5" y1="85.6"  x2="512.5" y2="80.2"  stroke="#1a1a1a" stroke-width="1.3"/>
  <circle cx="446" cy="167" r="7" fill="#4a7a2a" stroke="#2d5a10" stroke-width="1"/>
  <text   x="446" y="170" text-anchor="middle" font-size="8" fill="white" font-weight="bold">X</text>
  <text x="406" y="57" text-anchor="middle" font-size="10" fill="#6c757d">H</text>
  <text x="520" y="77" text-anchor="start"  font-size="10" fill="#6c757d">H</text>
  <text x="458" y="188" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold">Eclipsado</text>
  <text x="458" y="202" text-anchor="middle" font-size="10" fill="#4a4a4a">(0°)</text>
</svg>
