  <line x1="396" y1="265" x2="396" y2="270" stroke="#1a1a1a" stroke-width="1"/>
  <text x="396" y="280" text-anchor="middle" font-size="10" fill="#4a4a4a">4</text>
  <line x1="480" y1="265" x2="480" y2="270" stroke="#1a1a1a" stroke-width="1"/>
  <text x="480" y="280" text-anchor="middle" font-size="10" fill="#4a4a4a">5</text>

  <line x1="55" y1="216" x2="60" y2="216" stroke="#1a1a1a" stroke-width="1"/>
  <text x="50" y="220" text-anchor="end" font-size="10" fill="#4a4a4a">0.2</text>
  <line x1="55" y1="167" x2="60" y2="167" stroke="#1a1a1a" stroke-width="1"/>
  <text x="50" y="171" text-anchor="end" font-size="10" fill="#4a4a4a">0.4</text>
  <line x1="55" y1="118" x2="60" y2="118" stroke="#1a1a1a" stroke-width="1"/>
  <text x="50" y="122" text-anchor="end" font-size="10" fill="#4a4a4a">0.6</text>
  <line x1="55" y1="69" x2="60" y2="69" stroke="#1a1a1a" stroke-width="1"/>
  <text x="50" y="73" text-anchor="end" font-size="10" fill="#4a4a4a">0.8</text>
  <line x1="55" y1="65" x2="60" y2="65" stroke="#1a1a1a" stroke-width="1"/>
  <text x="50" y="35" text-anchor="end" font-size="10" fill="#4a4a4a">1.0</text>

  <text x="272" y="300" text-anchor="middle" font-size="11" fill="#1a1a1a">r (bohrs)</text>
  <text transform="rotate(-90, 14, 142)" x="14" y="142" text-anchor="middle" font-size="11" fill="#1a1a1a">φ(r) (u.a.)</text>

  <rect x="290" y="30" width="182" height="72" fill="white" fill-opacity="0.88" stroke="#dee2e6" stroke-width="1" rx="3"/>
  <line x1="300" y1="48" x2="328" y2="48" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="334" y="52" font-size="10" fill="#1a1a1a">STO (exacto)</text>
  <line x1="300" y1="64" x2="328" y2="64" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="8 4"/>
  <text x="334" y="68" font-size="10" fill="#c0392b">1 gaussiana</text>
  <line x1="300" y1="80" x2="328" y2="80" stroke="#2471a3" stroke-width="1.8" stroke-dasharray="10 3 2 3"/>
  <text x="334" y="84" font-size="10" fill="#2471a3">3 gaussianas (STO-3G)</text>
