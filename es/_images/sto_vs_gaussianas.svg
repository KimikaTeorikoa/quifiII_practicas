  <polygon points="60,14 56,22 64,22" fill="#1a1a1a"/>
  <line x1="60" y1="265" x2="484" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="486,265 478,261 478,269" fill="#1a1a1a"/>

