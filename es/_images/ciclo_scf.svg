<svg viewBox="0 0 300 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10">
  <title>Diagrama de flujo del ciclo SCF</title>
  <desc>Diagrama de flujo vertical del ciclo Self-Consistent Field de Hartree-Fock, con nodos de proceso y un rombo de decisión de convergencia con bucle de retorno.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect x="65" y="20" width="170" height="40" rx="6" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.2"/>
  <text x="150" y="36" text-anchor="middle" fill="#1a1a1a">Geometría y base</text>
  <text x="150" y="50" text-anchor="middle" fill="#1a1a1a">de funciones</text>

  <line x1="150" y1="60" x2="150" y2="78" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="65" y="80" width="170" height="40" rx="6" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.2"/>
  <text x="150" y="96" text-anchor="middle" fill="#1a1a1a">Estimación inicial de</text>
  <text x="150" y="110" text-anchor="middle" fill="#1a1a1a">orbitales (guess)</text>

  <line x1="150" y1="120" x2="150" y2="138" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="65" y="140" width="170" height="40" rx="6" fill="#e8f0f8" stroke="#4e9fc6" stroke-width="1.4"/>
  <text x="150" y="156" text-anchor="middle" fill="#1a1a1a">Construir matriz</text>
  <text x="150" y="170" text-anchor="middle" fill="#1a1a1a">de Fock F</text>

  <line x1="150" y1="180" x2="150" y2="198" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="65" y="200" width="170" height="40" rx="6" fill="#e8f0f8" stroke="#4e9fc6" stroke-width="1.4"/>
  <text x="150" y="216" text-anchor="middle" fill="#1a1a1a">Resolver</text>
  <text x="150" y="230" text-anchor="middle" font-style="italic" fill="#1a1a1a">FC = SCε</text>

  <line x1="150" y1="240" x2="150" y2="258" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arr)"/>

  <polygon points="150,260 225,295 150,330 75,295" fill="#fff8e8" stroke="#e07b39" stroke-width="1.4"/>
  <text x="150" y="291" text-anchor="middle" fill="#1a1a1a">¿Converge?</text>

  <line x1="150" y1="330" x2="150" y2="358" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="158" y="348" font-size="9" fill="#29a745" font-weight="bold">Sí</text>

  <rect x="65" y="360" width="170" height="40" rx="6" fill="#eaf5ea" stroke="#29a745" stroke-width="1.4"/>
  <text x="150" y="376" text-anchor="middle" fill="#1a1a1a">Orbitales y energías</text>
  <text x="150" y="390" text-anchor="middle" fill="#1a1a1a">finales</text>

  <line x1="75" y1="295" x2="32" y2="295" stroke="#4a4a4a" stroke-width="1.3"/>
  <text x="60" y="288" font-size="9" fill="#c0392b" font-weight="bold">No</text>
  <line x1="32" y1="295" x2="32" y2="160" stroke="#4a4a4a" stroke-width="1.3"/>
  <line x1="32" y1="160" x2="63" y2="160" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arr)"/>
</svg>
